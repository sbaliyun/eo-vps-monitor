name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, build, test and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: agent/go.mod
          cache-dependency-path: agent/go.sum

      - name: Install dependencies
        run: npm ci

      # Both packages type-check here: frontend and worker both run `tsc --noEmit`.
      - name: Lint
        run: npm run lint

      # Produces edgeone-dist with Pages assets, API functions and Agent sources.
      - name: Build
        run: npm run build

      # `npm test` chains test:js (node --test across the repo)
      # and test:go. The gate is the exit code -- never the output line count:
      # node --test prints per-file for top-level bare assertions and per-test for
      # test() files, so counting lines silently misses whole files.
      - name: Test
        run: npm test

      # These fixtures drop to nobody to check real filesystem access.
      # Their service commands are isolated; the normal runner skips them.
      - name: Installer service account permissions
        run: |
          sudo "$(command -v node)" --test --test-name-pattern='^compat (systemd|openrc) (default paths|must not open permissions)' agent/install-compat.test.mjs
          sudo "$(command -v node)" --test --test-name-pattern='^native ' agent/disk-collector-install.test.mjs

      - name: Agent root collector permissions
        working-directory: agent
        run: |
          go test -c -o "$RUNNER_TEMP/cf-monitor-agent-native.test" .
          sudo sh -s -- "$RUNNER_TEMP/cf-monitor-agent-native.test" <<'NATIVE'
          set -eu
          native_dir="$(mktemp -d /run/cf-monitor-agent-native.XXXXXX)"
          cleanup() {
            native_status=$?
            trap - EXIT HUP INT TERM
            case "$native_dir" in /run/cf-monitor-agent-native.??????) ;; *) exit 98 ;; esac
            [ "$(readlink -f -- "$native_dir")" = "$native_dir" ] || exit 99
            rm -rf -- "$native_dir"
            exit "$native_status"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0755 "$native_dir"
          install -m 0755 "$1" "$native_dir/agent.test"
          mkdir -m 0755 "$native_dir/tmp"
          TMPDIR="$native_dir/tmp" "$native_dir/agent.test" -test.run '^TestDirectoryDiskNative' -test.v
          NATIVE

      - name: Agent data race check
        working-directory: agent
        env:
          CGO_ENABLED: '1'
        run: go test -race ./...

      - name: Dependency and toolchain security
        run: npm run security:check

      - name: Build Agent binaries
        working-directory: agent
        env:
          CGO_ENABLED: '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          agent_build_dir="$RUNNER_TEMP/eo-vps-monitor-agent"
          mkdir -p "$agent_build_dir"
          agent_build_version="dev-${GITHUB_SHA:0:7}"
          ldflags="-s -w -X main.Version=${agent_build_version}"

          build() {
            local goos="$1"
            local goarch="$2"
            local output="$3"
            GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$ldflags" -o "${agent_build_dir}/${output}" .
          }

          build linux amd64 cf-vps-monitor-agent-linux-amd64
          build linux arm64 cf-vps-monitor-agent-linux-arm64
          build darwin amd64 cf-vps-monitor-agent-darwin-amd64
          build darwin arm64 cf-vps-monitor-agent-darwin-arm64
          build freebsd amd64 cf-vps-monitor-agent-freebsd-amd64
          build windows amd64 cf-vps-monitor-agent-windows-amd64.exe
          printf '%s\n' "repository=$GITHUB_REPOSITORY" "commit=$GITHUB_SHA" "version=$agent_build_version" > "$agent_build_dir/BUILD_INFO"
          (
            cd "$agent_build_dir"
            sha256sum cf-vps-monitor-agent-* > SHA256SUMS
          )

      - name: Upload Agent binaries
        uses: actions/upload-artifact@v7
        with:
          name: eo-vps-monitor-agent-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/eo-vps-monitor-agent/
          if-no-files-found: error
          retention-days: 14
